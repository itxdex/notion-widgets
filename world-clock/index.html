
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Notion World Clock</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: light dark;
  --text-primary: #111111;
  --text-secondary: #777777;
  --text-muted: #888888;
  --divider: #E5E5E5;
}

@media (prefers-color-scheme: dark) {
  :root {
    --text-primary: #F5F5F5;
    --text-secondary: #AAAAAA;
    --text-muted: #999999;
    --divider: #373737;
  }
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  padding: 0 12px 8px 6px;
}

.card {
  position: static;
  width: 100%;
  height: 122px;
  padding: 8px 14px;

  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;
  outline: none;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  color: var(--text-primary);
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  line-height: 1.2;
  color: var(--text-secondary);
  white-space: nowrap;
}

.icon {
  width: 15px;
  height: 15px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.clocks {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 7px;
}

.city-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.city {
  font-size: 11px;
  font-weight: 400;
  line-height: 1.2;
  color: var(--text-secondary);
  white-space: nowrap;
}

.time {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.2px;
  line-height: 1.2;
  color: var(--text-primary);
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.bottom {
  border-top: 1px solid var(--divider);
  padding-top: 7px;
}

.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;

  font-size: 10px;
  line-height: 1.2;
  letter-spacing: 0.3px;
  color: var(--text-muted);
}

@media (max-width: 220px) {
  .card {
    padding: 8px 10px;
  }

  .label {
    font-size: 9px;
  }

  .city {
    font-size: 10px;
  }

  .time {
    font-size: 11px;
  }

  .footer {
    font-size: 8px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="top">

    <div class="header">
      <span class="label">WORLD CLOCK</span>

      <svg class="icon"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.7"
           stroke-linecap="round"
           stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18"/>
        <path d="M12 3a15 15 0 0 1 0 18"/>
        <path d="M12 3a15 15 0 0 0 0 18"/>
      </svg>
    </div>

    <div class="clocks">

      <div class="city-row">
        <span class="city">Los Angeles</span>
        <span class="time" id="la">--:-- --</span>
      </div>

      <div class="city-row">
        <span class="city">Houston</span>
        <span class="time" id="houston">--:-- --</span>
      </div>

      <div class="city-row">
        <span class="city">New York</span>
        <span class="time" id="ny">--:-- --</span>
      </div>

    </div>
  </div>

  <div class="bottom">
    <div class="footer">
      <span>US TIME ZONES</span>
      <span id="date">---</span>
    </div>
  </div>

</div>

<script>
const cities = [
  {
    id: "la",
    zone: "America/Los_Angeles"
  },
  {
    id: "houston",
    zone: "America/Chicago"
  },
  {
    id: "ny",
    zone: "America/New_York"
  }
];

const formatters = cities.map(city => ({
  id: city.id,
  formatter: new Intl.DateTimeFormat(
    "en-US",
    {
      timeZone: city.zone,
      hour: "2-digit",
      minute: "2-digit",
      hour12: true
    }
  )
}));

const dateFormatter = new Intl.DateTimeFormat(
  "en-US",
  {
    timeZone: "America/Los_Angeles",
    month: "short",
    day: "numeric"
  }
);

function updateClocks() {
  const now = new Date();

  formatters.forEach(city => {
    document.getElementById(
      city.id
    ).textContent = city.formatter.format(now);
  });

  document.getElementById(
    "date"
  ).textContent = dateFormatter.format(now);
}

updateClocks();
setInterval(updateClocks, 1000);
</script>

</body>
</html>
