<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notion Black & Gray World Clock</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  padding: 0 12px 8px 6px;
}

.card {
  width: 100%;
  height: 122px;
  padding: 8px 14px;
  background: #FFFFFF;
  border: none;
  border-radius: 10px;
  box-shadow: none;
  outline: none;
  color: #111111;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  color: #777777;
  white-space: nowrap;
}

.icon {
  width: 15px;
  height: 15px;
  color: #888888;
  flex-shrink: 0;
}

.clocks {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 7px;
}

.city-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.city {
  font-size: 11px;
  line-height: 1.2;
  color: #555555;
  white-space: nowrap;
}

.time {
  font-size: 12px;
  font-weight: 600;
  line-height: 1.2;
  color: #111111;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.bottom {
  border-top: 1px solid #E5E5E5;
  padding-top: 7px;
}

.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-size: 9px;
  line-height: 1.2;
  letter-spacing: 0.3px;
  color: #888888;
}

@media (max-width: 220px) {
  .card {
    padding: 8px 10px;
  }

  .label {
    font-size: 9px;
  }

  .city {
    font-size: 10px;
  }

  .time {
    font-size: 11px;
  }

  .footer {
    font-size: 8px;
  }
}
</style>
</head>

<body>
<div class="card">

  <div class="top">
    <div class="header">
      <span class="label">WORLD CLOCK</span>

      <svg class="icon"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.7"
           stroke-linecap="round"
           stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18"/>
        <path d="M12 3a15 15 0 0 1 0 18"/>
        <path d="M12 3a15 15 0 0 0 0 18"/>
      </svg>
    </div>

    <div class="clocks">
      <div class="city-row">
        <span class="city">Los Angeles</span>
        <span class="time" id="la">--:-- --</span>
      </div>

      <div class="city-row">
        <span class="city">Houston</span>
        <span class="time" id="houston">--:-- --</span>
      </div>

      <div class="city-row">
        <span class="city">New York</span>
        <span class="time" id="ny">--:-- --</span>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="footer">
      <span>US TIME ZONES</span>
      <span id="date">---</span>
    </div>
  </div>

</div>

<script>
const cities = [
  {
    id: "la",
    zone: "America/Los_Angeles"
  },
  {
    id: "houston",
    zone: "America/Chicago"
  },
  {
    id: "ny",
    zone: "America/New_York"
  }
];

function updateClocks() {
  const now = new Date();

  cities.forEach(city => {
    const time = new Intl.DateTimeFormat("en-US", {
      timeZone: city.zone,
      hour: "2-digit",
      minute: "2-digit",
      hour12: true
    }).format(now);

    document.getElementById(city.id).textContent = time;
  });

  const date = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Los_Angeles",
    month: "short",
    day: "numeric"
  }).format(now);

  document.getElementById("date").textContent = date;
}

updateClocks();
setInterval(updateClocks, 1000);
</script>

</body>
</html>
