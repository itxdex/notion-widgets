
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black & Gray Compact Clock</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  padding: 0 14px 0 0;
}

.card {
  width: 100%;
  height: 122px;
  background: #FFFFFF;
  border: 1px solid #E0E0E0;
  border-radius: 14px;
  padding: 11px 16px;
  color: #111111;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.label {
  color: #777777;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  white-space: nowrap;
}

.icon {
  width: 15px;
  height: 15px;
  color: #888888;
  flex-shrink: 0;
}

.time {
  margin-top: 5px;
  font-size: clamp(22px, 7vw, 27px);
  font-weight: 700;
  letter-spacing: -0.8px;
  line-height: 1.1;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.date {
  margin-top: 4px;
  font-size: 11px;
  line-height: 1.2;
  color: #777777;
  white-space: nowrap;
}

.bottom {
  border-top: 1px solid #E5E5E5;
  padding-top: 7px;
}

.timezone {
  font-size: 10px;
  line-height: 1.2;
  color: #888888;
  letter-spacing: 0.3px;
  white-space: nowrap;
}

@media (max-width: 220px) {
  .card {
    padding: 10px;
  }

  .time {
    font-size: 21px;
  }

  .label, .timezone {
    font-size: 9px;
  }

  .date {
    font-size: 10px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="top">

    <div class="header">
      <span class="label">DIGITAL CLOCK</span>

      <svg class="icon"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.7"
           stroke-linecap="round"
           stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7v5l3 2"></path>
      </svg>
    </div>

    <div class="time" id="time">--:-- --</div>
    <div class="date" id="date">Loading...</div>

  </div>

  <div class="bottom">
    <div class="timezone">
      LOS ANGELES · PT
    </div>
  </div>

</div>

<script>
const TIMEZONE = "America/Los_Angeles";

function updateClock() {
  const now = new Date();

  const time = new Intl.DateTimeFormat("en-US", {
    timeZone: TIMEZONE,
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  }).format(now);

  const date = new Intl.DateTimeFormat("en-US", {
    timeZone: TIMEZONE,
    weekday: "short",
    month: "short",
    day: "numeric",
    year: "numeric"
  }).format(now);

  document.getElementById("time").textContent = time;
  document.getElementById("date").textContent = date;
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
