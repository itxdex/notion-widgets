
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notion Digital Clock - Auto Theme</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: light dark;
  --text-primary: #111111;
  --text-secondary: #777777;
  --text-muted: #888888;
  --divider: #E5E5E5;
}

@media (prefers-color-scheme: dark) {
  :root {
    --text-primary: #F5F5F5;
    --text-secondary: #AAAAAA;
    --text-muted: #999999;
    --divider: #373737;
  }
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  padding: 0 12px 8px 6px;
}

.card {
  position: static;
  width: 100%;
  height: 122px;
  padding: 8px 14px;
  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;
  outline: none;
  color: var(--text-primary);

  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.label {
  color: var(--text-secondary);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  white-space: nowrap;
}

.icon {
  width: 15px;
  height: 15px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.time {
  margin-top: 6px;
  font-size: clamp(22px, 7vw, 27px);
  font-weight: 700;
  letter-spacing: -0.8px;
  line-height: 1.1;
  color: var(--text-primary);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.date {
  margin-top: 5px;
  font-size: 11px;
  line-height: 1.2;
  color: var(--text-secondary);
  white-space: nowrap;
}

.bottom {
  border-top: 1px solid var(--divider);
  padding-top: 7px;
}

.timezone {
  font-size: 10px;
  line-height: 1.2;
  letter-spacing: 0.3px;
  color: var(--text-muted);
  white-space: nowrap;
}

@media (max-width: 220px) {
  .card {
    padding: 8px 10px;
  }

  .time {
    font-size: 21px;
  }

  .date {
    font-size: 10px;
  }

  .label, .timezone {
    font-size: 9px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="top">

    <div class="header">
      <span class="label">DIGITAL CLOCK</span>

      <svg class="icon"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.7"
           stroke-linecap="round"
           stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 2"/>
      </svg>
    </div>

    <div class="time" id="time">--:-- --</div>
    <div class="date" id="date">Loading...</div>

  </div>

  <div class="bottom">
    <div class="timezone">
      LOS ANGELES · PT
    </div>
  </div>

</div>

<script>
const TIMEZONE = "America/Los_Angeles";

const timeFormatter = new Intl.DateTimeFormat(
  "en-US",
  {
    timeZone: TIMEZONE,
    hour: "2-digit",
    minute: "2-digit",
    hour12: true
  }
);

const dateFormatter = new Intl.DateTimeFormat(
  "en-US",
  {
    timeZone: TIMEZONE,
    weekday: "short",
    month: "short",
    day: "numeric",
    year: "numeric"
  }
);

function updateClock() {
  const now = new Date();

  document.getElementById("time").textContent =
    timeFormatter.format(now);

  document.getElementById("date").textContent =
    dateFormatter.format(now);
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
