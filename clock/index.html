
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Notion Black & Gray Clock</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    body {
      padding: 6px 12px 8px 6px;
    }

    .clock {
      width: 100%;
      min-width: 0;
      background: #FFFFFF;
      border: 1px solid #E5E5E5;
      border-radius: 12px;
      padding: 14px;
      color: #111111;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #777777;
      white-space: nowrap;
    }

    .clock-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      color: #888888;
    }

    .time {
      margin: 10px 0 5px;
      font-size: clamp(22px, 8vw, 36px);
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1.2;
      color: #111111;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .date {
      font-size: 12px;
      line-height: 1.4;
      color: #777777;
      white-space: nowrap;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: #E5E5E5;
      margin: 13px 0 10px;
    }

    .timezone {
      font-size: 10px;
      letter-spacing: 0.5px;
      line-height: 1.4;
      color: #888888;
      white-space: nowrap;
    }

    @media (max-width: 220px) {
      body {
        padding: 5px 10px 6px 5px;
      }

      .clock {
        padding: 10px;
        border-radius: 10px;
      }

      .label {
        font-size: 9px;
      }

      .time {
        font-size: 23px;
      }

      .date {
        font-size: 11px;
      }

      .timezone {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <div class="clock">

    <div class="header">
      <span class="label">DIGITAL CLOCK</span>

      <svg class="clock-icon"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.7"
           stroke-linecap="round"
           stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7v5l3 2"></path>
      </svg>
    </div>

    <div class="time" id="time">
      --:-- --
    </div>

    <div class="date" id="date">
      Loading...
    </div>

    <div class="divider"></div>

    <div class="timezone">
      LOS ANGELES · PT
    </div>

  </div>

  <script>
    const TIMEZONE = "America/Los_Angeles";

    function updateClock() {
      const now = new Date();

      const time = new Intl.DateTimeFormat("en-US", {
        timeZone: TIMEZONE,
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      }).format(now);

      const date = new Intl.DateTimeFormat("en-US", {
        timeZone: TIMEZONE,
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric"
      }).format(now);

      document.getElementById("time").textContent = time;
      document.getElementById("date").textContent = date;
    }

    updateClock();

    setInterval(updateClock, 1000);
  </script>

</body>
</html>
