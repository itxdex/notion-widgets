<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notion Black & Gray Clock</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    body {
      padding: 6px 12px 8px 6px;
    }

    .card {
      width: 100%;
      min-height: 180px;
      background: #FFFFFF;
      border: 1px solid #E5E5E5;
      border-radius: 14px;
      padding: 16px 18px;
      color: #111111;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      color: #777777;
      white-space: nowrap;
    }

    .clock-icon {
      width: 16px;
      height: 16px;
      color: #888888;
      flex-shrink: 0;
    }

    .time {
      margin-top: 2px;
      font-size: clamp(24px, 8vw, 36px);
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1.15;
      color: #111111;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .date {
      font-size: 12px;
      line-height: 1.4;
      color: #777777;
      white-space: nowrap;
    }

    .bottom {
      margin-top: 14px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: #E5E5E5;
      margin-bottom: 12px;
    }

    .timezone {
      font-size: 10px;
      letter-spacing: 0.5px;
      line-height: 1.4;
      color: #888888;
      white-space: nowrap;
    }

    @media (max-width: 220px) {
      body {
        padding: 5px 10px 6px 5px;
      }

      .card {
        min-height: 170px;
        padding: 12px 14px;
        border-radius: 12px;
      }

      .label {
        font-size: 10px;
      }

      .time {
        font-size: 24px;
      }

      .date {
        font-size: 11px;
      }

      .timezone {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="top">
      <div class="header">
        <span class="label">DIGITAL CLOCK</span>

        <svg class="clock-icon"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.7"
             stroke-linecap="round"
             stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3 2"></path>
        </svg>
      </div>

      <div class="time" id="time">--:-- --</div>
      <div class="date" id="date">Loading...</div>
    </div>

    <div class="bottom">
      <div class="divider"></div>
      <div class="timezone">LOS ANGELES · PT</div>
    </div>
  </div>

  <script>
    const TIMEZONE = "America/Los_Angeles";

    function updateClock() {
      const now = new Date();

      const time = new Intl.DateTimeFormat("en-US", {
        timeZone: TIMEZONE,
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      }).format(now);

      const date = new Intl.DateTimeFormat("en-US", {
        timeZone: TIMEZONE,
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric"
      }).format(now);

      document.getElementById("time").textContent = time;
      document.getElementById("date").textContent = date;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
