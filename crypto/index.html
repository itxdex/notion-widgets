
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Crypto Market - Notion Widget</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: light dark;

  --primary: #111111;
  --secondary: #777777;
  --muted: #888888;
  --divider: #E5E5E5;
}

@media (prefers-color-scheme: dark) {
  :root {
    --primary: #F5F5F5;
    --secondary: #AAAAAA;
    --muted: #999999;
    --divider: #373737;
  }
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  padding: 0 12px 8px 6px;
}

.card {
  width: 100%;
  min-height: 238px;
  padding: 8px 14px;

  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;
  outline: none;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  line-height: 1.2;
  color: var(--secondary);
}

.icon {
  width: 15px;
  height: 15px;
  color: var(--muted);
}

.market {
  display: flex;
  flex-direction: column;
  margin-top: 12px;
}

.coin {
  display: grid;
  grid-template-columns:
    minmax(0, 1fr)
    minmax(75px, 1fr)
    minmax(55px, 0.65fr);

  align-items: center;
  gap: 8px;

  padding: 8px 0;
  border-bottom: 1px solid var(--divider);
}

.coin:last-child {
  border-bottom: none;
}

.name {
  font-size: 11px;
  color: var(--secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.symbol {
  font-size: 9px;
  color: var(--muted);
}

.price {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.change {
  font-size: 11px;
  font-weight: 600;
  color: var(--secondary);
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.bottom {
  border-top: 1px solid var(--divider);
  padding-top: 7px;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;

  font-size: 10px;
  color: var(--muted);
}

.footer a {
  color: var(--muted);
  text-decoration: none;
}

.status {
  margin-top: 6px;
  font-size: 9px;
  line-height: 1.4;
  color: var(--muted);
}

@media (max-width: 300px) {
  .card {
    padding: 8px 10px;
  }

  .coin {
    gap: 4px;
    grid-template-columns:
      minmax(0, 1fr)
      minmax(62px, 1fr)
      minmax(45px, 0.65fr);
  }

  .name,
  .price,
  .change {
    font-size: 10px;
  }

  .symbol {
    font-size: 8px;
  }

  .footer {
    font-size: 9px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="top">

    <div class="header">

      <span class="title">
        CRYPTO MARKET
      </span>

      <svg class="icon"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.7"
           stroke-linecap="round"
           stroke-linejoin="round">
        <path d="M3 17l6-6 4 4 8-8"/>
        <path d="M15 7h6v6"/>
      </svg>

    </div>

    <div class="market">

      <div class="coin">
        <span class="name">
          Bitcoin <span class="symbol">BTC</span>
        </span>
        <span class="price" id="btc-price">—</span>
        <span class="change" id="btc-change">—</span>
      </div>

      <div class="coin">
        <span class="name">
          Ethereum <span class="symbol">ETH</span>
        </span>
        <span class="price" id="eth-price">—</span>
        <span class="change" id="eth-change">—</span>
      </div>

      <div class="coin">
        <span class="name">
          Solana <span class="symbol">SOL</span>
        </span>
        <span class="price" id="sol-price">—</span>
        <span class="change" id="sol-change">—</span>
      </div>

      <div class="coin">
        <span class="name">
          XRP <span class="symbol">XRP</span>
        </span>
        <span class="price" id="xrp-price">—</span>
        <span class="change" id="xrp-change">—</span>
      </div>

      <div class="coin">
        <span class="name">
          Dogecoin <span class="symbol">DOGE</span>
        </span>
        <span class="price" id="doge-price">—</span>
        <span class="change" id="doge-change">—</span>
      </div>

    </div>
  </div>

  <div class="bottom">

    <div class="footer">
      <span>USD · 24H CHANGE</span>

      <a href="https://www.coingecko.com/"
         target="_blank"
         rel="noopener noreferrer">
        CoinGecko
      </a>
    </div>

    <div class="status"
         id="status"
         role="status">
      Loading market prices...
    </div>

  </div>

</div>

<script>
const COINS = [
  { id: "bitcoin", key: "btc" },
  { id: "ethereum", key: "eth" },
  { id: "solana", key: "sol" },
  { id: "ripple", key: "xrp" },
  { id: "dogecoin", key: "doge" }
];

// Refresh every 2 minutes
const REFRESH_MS = 120000;

const url = new URL(
  "https://api.coingecko.com/api/v3/simple/price"
);

url.searchParams.set(
  "ids",
  COINS.map(c => c.id).join(",")
);

url.searchParams.set(
  "vs_currencies", "usd"
);

url.searchParams.set(
  "include_24hr_change", "true"
);

url.searchParams.set(
  "include_last_updated_at", "true"
);

const get = id => document.getElementById(id);

function formatPrice(value) {
  if (!Number.isFinite(value)) return "—";

  return new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: 2,
    maximumFractionDigits: value < 1 ? 5 : 2
  }).format(value);
}

function formatChange(value) {
  if (!Number.isFinite(value)) return "—";

  const prefix = value > 0 ? "+" : "";

  return (
    prefix +
    value.toFixed(2) +
    "%"
  );
}

let loading = false;
let hasData = false;

async function loadPrices() {
  if (loading) return;

  loading = true;

  const controller = new AbortController();
  const timeout = setTimeout(
    () => controller.abort(),
    12000
  );

  try {
    const response = await fetch(
      url.toString(),
      {
        cache: "no-store",
        signal: controller.signal
      }
    );

    if (!response.ok) {
      throw new Error(
        "API returned " + response.status
      );
    }

    const data = await response.json();
    let loaded = 0;

    for (const coin of COINS) {
      const item = data[coin.id];

      if (!item || !Number.isFinite(item.usd)) {
        continue;
      }

      get(coin.key + "-price").textContent =
        formatPrice(item.usd);

      get(coin.key + "-change").textContent =
        formatChange(item.usd_24h_change);

      loaded++;
    }

    if (loaded === 0) {
      throw new Error("No price data");
    }

    hasData = true;

    const checked = new Intl.DateTimeFormat(
      "en-US",
      {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
      }
    ).format(new Date());

    get("status").textContent =
      loaded === COINS.length
      ? "Checked " + checked +
        " · Refresh every 2 min"
      : "Partial data · Checked " + checked;

  } catch (error) {
    get("status").textContent = hasData
      ? "Update failed · Showing previous prices"
      : "Data unavailable · Retrying in 2 min";
  } finally {
    clearTimeout(timeout);
    loading = false;
  }
}

loadPrices();
setInterval(loadPrices, REFRESH_MS);
</script>

</body>
</html>
